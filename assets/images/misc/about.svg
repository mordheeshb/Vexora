<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b2a4a"/>
      <stop offset="50%" stop-color="#0f3b68"/>
      <stop offset="100%" stop-color="#144b82"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff7b38"/>
      <stop offset="100%" stop-color="#ff9d00"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.5">
      <stop offset="0%" stop-color="#1a6bb5" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0b2a4a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>
  <circle cx="400" cy="350" r="280" fill="url(#glow)"/>
  
  <rect x="220" y="220" width="360" height="360" rx="32" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
  <rect x="250" y="250" width="300" height="300" rx="24" fill="rgba(255,255,255,0.04)"/>
  
  <!-- Icon symbol -->
  <path d="M 330 330 L 400 450 L 470 330" stroke="url(#accent)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <circle cx="400" cy="310" r="16" fill="#ff7b38"/>

  <text x="50%" y="64%" font-family="'Outfit', 'Inter', sans-serif" font-size="44" fill="#ffffff" text-anchor="middle" dominant-baseline="middle" font-weight="800" letter-spacing="4">VEXORA</text>
  <text x="50%" y="72%" font-family="'Inter', sans-serif" font-size="20" fill="rgba(255,255,255,0.75)" text-anchor="middle" dominant-baseline="middle" font-weight="500" letter-spacing="2">STUDIO &amp; CURATION</text>
</svg>