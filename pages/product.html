<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product — VEXORA</title>
<link rel="icon" href="../assets/images/logo/logo.jpeg" type="image/jpeg">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body data-page="products" data-root="../">
<a href="#main" class="skip-link">Skip to content</a>
<div class="page-transition" aria-hidden="true"><div class="loader-mark"></div></div>

<header class="navbar">
  <div class="container nav-inner">
    <a href="../index.html" class="brand">
      <img src="../assets/images/logo/logo.jpeg" alt="VEXORA logo">
      <span data-brand-name>VEXORA</span>
    </a>
    <div class="nav-search-wrap">
      <svg class="nav-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.35-4.35"></path></svg>
      <input type="search" class="nav-search-input" placeholder="Search 14 categories & products..." aria-label="Search products and categories">
      <div class="nav-search-dropdown"></div>
    </div>
    <nav class="nav-links" id="navLinks" aria-label="Primary">
      <a href="../index.html">Home</a>
      <a href="../index.html#about">About</a>
      <a href="categories.html" data-nav="categories">Categories</a>
      <a href="products.html" data-nav="products">Products</a>
      <a href="../index.html#contact">Contact</a>
    </nav>
    <div class="nav-cta">
      <a data-contact="whatsapp" href="#" class="btn btn-accent btn-sm">WhatsApp Us</a>
      <button class="nav-toggle" aria-label="Toggle menu" aria-expanded="false"><span></span></button>
    </div>
  </div>
</header>

<main id="main">
  <div class="page-header" style="padding-bottom:20px;">
    <div class="container">
      <div class="breadcrumb" id="breadcrumb"></div>
    </div>
  </div>

  <section class="section-tight">
    <div class="container pd-grid">
      <div>
        <div class="pd-gallery-main">
          <img id="pdMainImage" src="../assets/images/placeholder.svg" alt="">
        </div>
        <div class="pd-thumbs" id="pdThumbs"></div>
      </div>
      <div data-reveal>
        <span class="pd-cat-tag" id="pdCategoryTag">Category</span>
        <h1 class="pd-title" id="pdTitle">Loading…</h1>
        <div class="pd-price" id="pdPrice"></div>
        <p class="pd-desc" id="pdDesc"></p>

        <div class="pd-contact">
          <a data-contact="whatsapp" href="#" class="btn btn-accent">💬 WhatsApp Enquiry</a>
          <a data-contact="call" href="#" class="btn btn-outline">📞 Call Now</a>
          <a data-contact="email" href="#" class="btn btn-outline">✉️ Email Us</a>
        </div>

        <div class="pd-specs">
          <h3 style="font-size:16px;font-weight:700;margin-bottom:8px;">Specifications</h3>
          <div id="pdSpecs"></div>
        </div>
      </div>
    </div>
  </section>

  <section class="section-tight" style="background:var(--color-surface);">
    <div class="container">
      <div class="section-head" data-reveal style="margin-bottom:36px;">
        <span class="eyebrow">You might also like</span>
        <h2 class="section-title">Related products</h2>
      </div>
      <div class="grid grid-4" id="relatedGrid"></div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="container footer-bottom">
    <span>© <span id="year"></span> VEXORA. All rights reserved.</span>
    <a href="../index.html">Back to home</a>
  </div>
</footer>

<button class="back-to-top" aria-label="Back to top">↑</button>
<script src="../js/app.js"></script>
<script src="../js/tilt3d.js"></script>
<script src="../js/catalog.js"></script>
<script>
  document.getElementById('year').textContent = new Date().getFullYear();
  Catalog.renderProductDetailPage();
</script>
</body>
</html>
